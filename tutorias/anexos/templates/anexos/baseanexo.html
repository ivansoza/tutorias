<!doctype html>
<html lang="es">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Reporte PDF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <style>
        @page {
            size: "A4";
            margin: 1.0cm 1.5cm 3.5cm 1.5cm;
        }
        body {
            width: 100% !important;
            height: 100%;
            background: #fff;
            color: black;
            font-size: 100%;
            font-family: 'Roboto', sans-serif;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: none; 
        }
        .header {
            font-weight: bold;
            font-size: 20px;
            text-align: center;  /* Asegura que el texto esté centrado horizontalmente */
        }

        .fecha {
            margin-top: 20px;
            text-align: right; /* Alinea el texto a la derecha */
            margin-right: 20px; /* Asegura un poco de margen a la derecha */
            font-size: 18px;
        }
        .linea {
            border-bottom: 1px solid black; /* Crea la línea subrayada */
            padding: 0 1em; /* Ajusta el espacio para la línea */
            display: inline-block; /* Asegura que la línea sea del ancho del texto */
        }
        .datos-generales {
            font-weight: bold; /* Texto en negrita */
            font-size: 18px; /* Tamaño del texto */
            margin-top: 20px; /* Espacio arriba para separarlo de otros elementos */
            text-align: left; /* Alineación a la izquierda */
            margin-left: 20px; /* Espacio a la izquierda para alinearlo adecuadamente en la página */
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.1; /* Hacerla más suave */
            z-index: -1;
            width: 600px; /* Aumentar el tamaño */
            height: auto; /* Mantener la proporción */
        }
        
        
    </style>
</head>
<body>

    <img src="{{ marca_agua }}" class="watermark" alt="Marca de Agua" width="300">

<main class="container">
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
