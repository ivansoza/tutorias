{% extends "base.html" %}




{% block sin_bread %}
{% endblock sin_bread %}

{% block content %}


<style>
    .card {
        transition: transform 0.2s ease-in-out;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Asegura que el contenido se distribuya de manera uniforme */
        border-radius: 10px; /* Bordes redondeados para un look moderno */
    }
    
    .card:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Sombra más pronunciada en hover */
    }
    
    .d-flex {
        display: flex;
        flex-grow: 1; /* Permite que los divs crezcan para llenar el espacio disponible */
    }
    
    .card-body i {
        margin-bottom: 10px; /* Espacio entre icono y texto */
        transition: transform 0.3s ease-in-out; /* Suave transición para el efecto de crecimiento */
    }

    .card:hover .card-body i {
        transform: scale(1.2); /* Aumenta el tamaño del icono al hacer hover */
    }

    .card-body {
        padding: 20px; /* Más padding para una apariencia más rica */
    }
</style>


<div class="container mt-4">
    <div class="row">
        <!-- Tarjeta de Coordinadores -->
        <div class="col-4 d-flex">
            <a href="{% url 'coordinadores-list' %}" class="card text-decoration-none w-100 bg-primary text-white">
                <div class="card-body text-center">
                    <h5 class="card-title mb-3"><i class="fas fa-users-cog fa-2x"></i><br>Coordinadores</h5>
                    <p class="card-text">Información y gestión de coordinadores.</p>
                </div>
            </a>
        </div>
        <!-- Tarjeta de Docentes -->
        <div class="col-4 d-flex">
            <a href="{% url 'docentes-list' %}" class="card text-decoration-none w-100 bg-success text-white">
                <div class="card-body text-center">
                    <h5 class="card-title mb-3"><i class="fas fa-chalkboard-teacher fa-2x"></i><br>Docentes</h5>
                    <p class="card-text">Accede a los perfiles y datos de los docentes.</p>
                </div>
            </a>
        </div>
        <!-- Tarjeta de Alumnos -->
        <div class="col-4 d-flex">
            <a href="{% url 'alumnos-list' %}" class="card text-decoration-none w-100 bg-info text-white">
                <div class="card-body text-center">
                    <h5 class="card-title mb-3"><i class="fas fa-user-graduate fa-2x"></i><br>Alumnos</h5>
                    <p class="card-text">Explora la información de los alumnos.</p>
                </div>
            </a>
        </div>
    </div>
</div>




{% endblock content %}
